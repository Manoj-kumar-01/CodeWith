
services:
  # MongoDB - For logs, analytics, flexible metadata
  mongodb:
    image: mongo:6-jammy
    container_name: compiler-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD}
      MONGO_INITDB_DATABASE: compiler_analytics
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      - ./init/mongodb-init.js:/docker-entrypoint-initdb.d/init.js
    networks:
      - compiler-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - For session cache, rate limiting, real-time data
  redis:
    image: redis:7-alpine
    container_name: compiler-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - compiler-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API Server
  backend:
    build: ./backend
    container_name: compiler-backend
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=3001
      - MONGODB_URI=${MONGODB_URI}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - IN_DOCKER=true
    ports:
      - "3001:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - compiler-temp:/tmp/compiler
      - ./backend:/app
      - /app/node_modules
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - compiler-network

networks:
  compiler-network:
    driver: bridge

volumes:
  mongodb-data:
  redis-data:
  compiler-temp: